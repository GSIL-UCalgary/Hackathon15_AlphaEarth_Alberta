method: bayes
metric:
  name: val/mean_iou
  goal: maximize
parameters:
  model_name:
    values: ["BasicUNet", "MIMUNet", "SwinUNet", "HRNet"]
  sensor_name:
    values: ["landsat8", "sentinel2", "alphaearth"]
  learning_rate:
    distribution: log_uniform
    min: 1e-5
    max: 1e-3
  batch_size:
    values: [8, 16, 32]
  weight_decay:
    distribution: uniform
    min: 1e-6
    max: 1e-4
  optimizer:
    values: ["adam", "adamw"]
  loss_fn:
    values: ["cross_entropy", "focal"]