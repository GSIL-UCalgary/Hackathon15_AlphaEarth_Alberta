# Multi-sensor Semantic Segmentation Configuration
# 1- This command is used to train the model using the specified configuration file.
# python train.py --config config/sentinel2_config.yaml

# 2- This command is used to perform scene classification using the trained model on the Sentinel-2 dataset.
# python scene_classification.py --sensor_name sentinel2 --model_name ParallelGraphMHCSegNet

# 3- This command is used to calculate metrics for the scene classification results using the trained model on the Sentinel-2 dataset.
# python scene_classified_calculate_metrics.py --sensor_name sentinel2 --model_name ParallelGraphMHCSegNet

# 4- This command is used to perform scene classification specifically for the Saskatchewan region using the trained model on the Sentinel-2 dataset.
# python scene_classification_saskachewan.py --sensor_name sentinel2 --model_name MambaHSISeg

# Model and dataset
# models: SwinUNet, BasicUNet, HRNet, MambaHSISeg, convnext, mHC_cluster, ssrn, OBIA_Mamba, ViT, mHC_spec_spa_mamba, physical_mhc_mamba
# cluster_MambaHSI



# -----------------------------------------------------------------------------
# Model & Dataset
# -----------------------------------------------------------------------------
model_name:       "ParallelGraphMHCSegNet"
sensor_name:      "sentinel2"
label_type:       "filtered"       # filtered | unfiltered
num_classes:      13
image_patch_size: 224              # 128 | 224
split_image:      false            # split full image into 4 overlapping quadrants

# Model capacity
hidden_dim: 64                     # base channel width (64 | 128)

# Cluster-Mamba specific (ignored by other models)
group_num:  16
token_num:  16


# -----------------------------------------------------------------------------
# Paths  ({patch_size} is replaced at runtime with image_patch_size)
# -----------------------------------------------------------------------------
data_root:      "./train_val_test_patches_{patch_size}x{patch_size}_purity_threshold_0.3_v2/patches"
dataset_config: "./train_val_test_patches_{patch_size}x{patch_size}_purity_threshold_0.3_v2/multisensor_dataset_config.json"
output_dir:     "./experiments"


# -----------------------------------------------------------------------------
# Optimizer & Scheduler
# -----------------------------------------------------------------------------
optimizer:     "adamw"             # adam | adamw | sgd
learning_rate: 0.0001
weight_decay:  0.001
scheduler:     "cosine"              # cosine | reduce_on_plateau | step | none
warmup_epochs: 5                     # for cosine scheduler

# -----------------------------------------------------------------------------
# Loss
# -----------------------------------------------------------------------------
loss_fn:       "cross_entropy"
ignore_index:  -99
class_weights: null                # null | path/to/weights.json | [w0,w1,...,w12]


# -----------------------------------------------------------------------------
# Training Loop
# -----------------------------------------------------------------------------
epochs:     100
batch_size: 4
use_amp:    true                   # mixed-precision (recommended — halves memory)
num_workers: 4
save_every: 10                     # save a checkpoint every N epochs
seed:       42


# -----------------------------------------------------------------------------
# Weights & Biases Logging
# -----------------------------------------------------------------------------
use_wandb:      true
wandb_project:  "AlphaEarth_Alberta_2020"
wandb_entity:   "saeid_taleghani"
